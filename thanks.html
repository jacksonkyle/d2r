<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanks — your message is on its way | Dreams2Reality</title>
    <meta name="description" content="Your quote request has been received. Matthew will get back to you within 1-2 business days.">
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="https://www.d2rmurals.com/thanks.html">
    <link rel="icon" href="/Images/logo.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="/Images/logo.jpg">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="index.css">
    <style>
        .thanks-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px;
            text-align: center;
        }
        .thanks-card {
            max-width: 560px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }
        .thanks-card h1 {
            font-size: 2.5rem;
            margin: 0 0 16px;
            background: linear-gradient(45deg, #00ccff, #ff00cc, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .thanks-card p {
            color: #ddd;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }
        .thanks-actions {
            margin-top: 28px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .thanks-actions a {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            background: linear-gradient(45deg, #00ccff, #ff00cc);
            color: #fff;
        }
        .thanks-actions a.outline {
            background: transparent;
            border: 2px solid #fff;
        }
    </style>
    <link rel="stylesheet" href="polish.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <div class="overlay"></div>

    <main id="main" class="thanks-wrap">
        <div class="thanks-card">
            <h1>Thanks!</h1>
            <p>Your quote request has been received.</p>
            <p>Matthew will reply by email within 1-2 business days. If you need a faster answer, call <a href="tel:757-450-2884" style="color:#4ecdc4">757-450-2884</a>.</p>
            <div class="thanks-actions">
                <a href="/">Back to home</a>
                <a href="/matthew_jackson_portfolio.html" class="outline">View portfolio</a>
            </div>
        </div>
    </main>
    <script src="polish.js" defer></script>
</body>
</html>
